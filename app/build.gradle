plugins { id 'com.android.application' }

android {
    namespace 'com.warrioraspirants.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.warrioraspirants.app'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.7'
    }

    signingConfigs {
        release {
            def ks = System.getenv('WA_KEYSTORE_FILE')
            if (ks != null && !ks.isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv('WA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('WA_KEY_ALIAS')
                keyPassword System.getenv('WA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('WA_KEYSTORE_FILE') != null && !System.getenv('WA_KEYSTORE_FILE').isEmpty()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}
