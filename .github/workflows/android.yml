name: Build Warrior Aspirants APK
# Fighter AI endpoint fix build trigger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Check release signing configuration
        id: signing
        env:
          WA_KEYSTORE_BASE64: ${{ secrets.WA_KEYSTORE_BASE64 }}
          WA_KEYSTORE_PASSWORD: ${{ secrets.WA_KEYSTORE_PASSWORD }}
          WA_KEY_ALIAS: ${{ secrets.WA_KEY_ALIAS }}
          WA_KEY_PASSWORD: ${{ secrets.WA_KEY_PASSWORD }}
        run: |
          if [ -n "$WA_KEYSTORE_BASE64" ] && [ -n "$WA_KEYSTORE_PASSWORD" ] && [ -n "$WA_KEY_ALIAS" ] && [ -n "$WA_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "$WA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/warrior-release.jks"
            echo "WA_KEYSTORE_FILE=$RUNNER_TEMP/warrior-release.jks" >> "$GITHUB_ENV"
            echo "WA_KEYSTORE_PASSWORD=$WA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "WA_KEY_ALIAS=$WA_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "WA_KEY_PASSWORD=$WA_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; debug build will still be produced."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release signature
        if: steps.signing.outputs.configured == 'true'
        run: |
          SDK_APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$SDK_APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Warrior-Aspirants-v1.7-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload permanent release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Warrior-Aspirants-v1.7-release-apk
          path: app/build/outputs/apk/release/app-release.apk
