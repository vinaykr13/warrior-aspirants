name: Build Warrior Aspirants APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing
        env:
          WA_KEYSTORE_BASE64: ${{ secrets.WA_KEYSTORE_BASE64 }}
          WA_KEYSTORE_PASSWORD: ${{ secrets.WA_KEYSTORE_PASSWORD }}
          WA_KEY_ALIAS: ${{ secrets.WA_KEY_ALIAS }}
          WA_KEY_PASSWORD: ${{ secrets.WA_KEY_PASSWORD }}
        run: |
          if [ -z "$WA_KEYSTORE_BASE64" ] || [ -z "$WA_KEYSTORE_PASSWORD" ] || [ -z "$WA_KEY_ALIAS" ] || [ -z "$WA_KEY_PASSWORD" ]; then
            echo "Release signing secrets are not configured."
            exit 1
          fi
          echo "$WA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/warrior-release.jks"
          echo "WA_KEYSTORE_FILE=$RUNNER_TEMP/warrior-release.jks" >> "$GITHUB_ENV"
          echo "WA_KEYSTORE_PASSWORD=$WA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "WA_KEY_ALIAS=$WA_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "WA_KEY_PASSWORD=$WA_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --version && gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          SDK_APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$SDK_APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Warrior-Aspirants-v1.2-release-apk
          path: app/build/outputs/apk/release/app-release.apk
